    setup: { strategy: "clone", branch: "lab/08-active-waiver", operations:
      [{name: "replace", path: "app/models/order.rb", from: "\nend\n", to: "\n  def waived_calculation\n    unused_temp = 'temporary'\n    total_amount\n  end\nend\n"}, {name: "waiver_from_current"}] }
    command: *check_changed
    expected_gate: "PASS"
    expected_completion: "complete"
    expected_exit: 0
    expected: { waived_min: 1 }
    cleanup: "remove_worktree"
    tags: ["baseline", "waiver", "positive"]

  - id: "RVLAB-09"
    title: "Expired waiver blocks the change"
    category: "baseline_waiver"
    description: "Use the same public fingerprint workflow with an expired date."
    setup: { strategy: "clone", branch: "lab/09-expired-waiver", operations:
      [{name: "replace", path: "app/models/order.rb", from: "\nend\n", to: "\n  def expired_calculation\n    unused_expired = 'expired'\n    total_amount\n  end\nend\n"}, {name: "waiver_from_current", expires_at: "2026-06-01T00:00:00Z"}] }
