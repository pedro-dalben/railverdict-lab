  - id: "RVLAB-15"
    title: "Repair rejects policy weakening"
    category: "repair_anti_cheating"
    description: "Build a public MCP repair packet, modify policy, and verify repair in the same stdio session."
    setup: { strategy: "clone", branch: "lab/15-repair-policy-cheat", operations:
      [{name: "replace", path: "app/models/customer.rb", from: "\nend\n", to: "\n  def bad_method\n    unused_var = 123\n  end\nend\n"}, {name: "commit"}] }
    command: { interface: "mcp_repair", cheat: "config" }
    expected_gate: "WARN"
    expected_completion: "complete"
    expected_exit: 1
    expected: { boundary_changed: true, boundary_changed_config: true, target_status: "still_present" }
    cleanup: "remove_worktree"
    tags: ["repair", "security", "mcp"]

