---
schema_version: '2.0'
catalog_version: '2.0'
description: External black-box validation contract for the RailVerdict candidate.
check_changed: &1
  interface: cli
  args:
  - check
  - "--changed"
  - "--base"
  - main
  - "--format"
  - json
check_full: &2
  interface: cli
  args:
  - check
  - "--format"
  - json
scenarios:
- id: RVLAB-01
  title: Clean model behavior with a matching test
  category: acceptance
  description: Add a tested Order model method through a real Git commit.
  setup:
    strategy: clone
    branch: lab/01-clean-change
    operations:
    - name: replace
      path: app/models/order.rb
      from: |2

        end
      to: |2

          def formatted_total
            format('%.2f', total_amount)
          end
        end
    - name: write
      path: spec/models/order_format_spec.rb
      content: |
        require "spec_helper"

        RSpec.describe Order do
          it "formats the total" do
            expect(Order.new(total_amount: 50.0).formatted_total).to eq("50.00")
          end
        end
    - name: commit
  command: *1
  expected_gate: PASS
  expected_completion: complete
  expected_exit: 0
  expected:
    introduced_max: 0
  cleanup: remove_worktree
  tags:
  - fast
  - acceptance
  - positive
- id: RVLAB-02
  title: Historical debt remains non-blocking
  category: acceptance
  description: Touch a harmless file while the tracked baseline debt remains existing.
  setup:
    strategy: clone
    branch: lab/02-existing-debt
    operations:
    - name: append
      path: app/models/customer.rb
      content: |2

        # harmless synthetic touch
    - name: commit
  command: *1
  expected_gate: PASS
  expected_completion: complete
  expected_exit: 0
  expected:
    introduced_count: 0
    existing_min: 3
  cleanup: remove_worktree
  tags:
  - fast
  - acceptance
  - baseline
