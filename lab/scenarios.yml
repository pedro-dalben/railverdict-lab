    setup: { strategy: "clone", branch: "lab/18-mcp-loop", operations:
      [{name: "replace", path: "app/services/legacy_audit_logger.rb", from: "\nend\n", to: "\n  def self.lab_touch\n    unused_value = 1\n    'ok'\n  end\nend\n"}, {name: "commit"}] }
