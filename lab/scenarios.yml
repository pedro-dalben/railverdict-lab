  setup:
    strategy: clone
    branch: rvlab-rh-simplecov-0x
    operations:
    - name: write_raw
      path: .railverdict.yml
      content: |
        version: 1.3
        mode: no_new_debt
        analyzers:
          rubocop:
            enabled: true
            required: true
          minitest:
            enabled: false
            required: false
          rspec:
            enabled: true
            required: true
          simplecov:
            enabled: true
            required: true
            coverage_path: tmp/rv-coverage.json
            freshness_window_seconds: 86400
          bundler_audit:
            enabled: true
            required: false
        git:
          base: main
    - name: ensure_coverage_dir
    - name: write_raw
      path: tmp/rv-coverage.json
      content: '{"meta":{"simplecov_version":"0.20.0"},"coverage":{"/tmp/fake/app.rb":{"lines":[1,1]}},"timestamp":1700000000}'
    - name: commit
  command:
    interface: cli
    args:
    - check
    - --format
    - json
