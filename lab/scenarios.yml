schema_version: "2.0"
catalog_version: "2.0"
description: "External black-box validation contract for the RailVerdict candidate."

check_changed: &check_changed
  interface: "cli"
  args: ["check", "--changed", "--base", "main", "--format", "json"]
check_full: &check_full
  interface: "cli"
  args: ["check", "--format", "json"]

scenarios:
  - id: "RVLAB-01"
    title: "Clean model behavior with a matching test"
    category: "acceptance"
    description: "Add a tested Order model method through a real Git commit."
    setup: { strategy: "clone", branch: "lab/01-clean-change", operations:
      [{name: "replace", path: "app/models/order.rb", from: "\nend\n", to: "\n  def formatted_total\n    format('%.2f', total_amount)\n  end\nend\n"},
       {name: "write", path: "spec/models/order_format_spec.rb", content: "require \"spec_helper\"\n\nRSpec.describe Order do\n  it \"formats the total\" do\n    expect(Order.new(total_amount: 50.0).formatted_total).to eq(\"50.00\")\n  end\nend\n"}, {name: "commit"}] }
    command: *check_changed
    expected_gate: "PASS"
    expected_completion: "complete"
    expected_exit: 0
    expected: { introduced_max: 0 }
    cleanup: "remove_worktree"
    tags: ["fast", "acceptance", "positive"]

  - id: "RVLAB-02"
    title: "Historical debt remains non-blocking"
    category: "acceptance"
    description: "Touch a harmless file while the tracked baseline debt remains existing."
    setup: { strategy: "clone", branch: "lab/02-existing-debt", operations:
      [{name: "append", path: "app/models/customer.rb", content: "\n# harmless synthetic touch\n"}, {name: "commit"}] }
    command: *check_changed
    expected_gate: "PASS"
    expected_completion: "complete"
    expected_exit: 0
    expected: { introduced_count: 0, existing_min: 3 }
    cleanup: "remove_worktree"
    tags: ["fast", "acceptance", "baseline"]

  - id: "RVLAB-03"
    title: "New RuboCop offense is rejected"
    category: "policy_rejection"
    description: "Introduce Lint/UselessAssignment in changed scope."
    setup: { strategy: "clone", branch: "lab/03-new-rubocop", operations:
      [{name: "replace", path: "app/models/order.rb", from: "\nend\n", to: "\n  def invalid_discount\n    unused_discount_factor = 0.15\n    total_amount * 0.9\n  end\nend\n"}, {name: "commit"}] }
    command: *check_changed
    expected_gate: "FAIL"
    expected_completion: "complete"
    expected_exit: 1
    expected: { introduced_min: 1 }
    cleanup: "remove_worktree"
    tags: ["fast", "policy", "rubocop"]

  - id: "RVLAB-04"
    title: "Real Minitest failure"
    category: "policy_rejection"
    description: "Enable required Minitest and fail a real Rails test assertion."
    setup: { strategy: "clone", branch: "lab/04-minitest-failure", operations:
      [{name: "config_replace", from: "minitest:\n    enabled: false\n    required: false", to: "minitest:\n    enabled: true\n    required: true"},
       {name: "replace", path: "test/models/order_test.rb", from: "assert @order.valid?", to: "assert_equal 'INVALID', @order.status"}, {name: "commit"}] }
    command: *check_changed
    expected_gate: "FAIL"
    expected_completion: "complete"
    expected_exit: 1
    expected: { analyzer: "minitest", analyzer_status: "succeeded" }
    cleanup: "remove_worktree"
    tags: ["policy", "minitest", "regression"]

  - id: "RVLAB-05"
    title: "Real RSpec failure"
    category: "policy_rejection"
    description: "Change a real RSpec expectation so the suite fails."
    setup: { strategy: "clone", branch: "lab/05-rspec-failure", operations:
      [{name: "replace", path: "spec/models/product_spec.rb", from: "expect(product.available?).to be true", to: "expect(product.available?).to be false"}, {name: "commit"}] }
    command: *check_changed
    expected_gate: "FAIL"
    expected_completion: "complete"
    expected_exit: 1
    expected: { analyzer: "rspec", analyzer_status: "succeeded" }
    cleanup: "remove_worktree"
    tags: ["policy", "rspec", "regression"]

  - id: "RVLAB-06"
    title: "Required test suite with zero tests"
    category: "refusal"
    description: "Replace the RSpec surface with an empty suite and require evidence."
    setup: { strategy: "clone", branch: "lab/06-zero-tests", operations:
      [{name: "write", path: "spec/models/product_spec.rb", content: "require \"spec_helper\"\n"}, {name: "commit"}] }
    command: *check_changed
    expected_gate: "INCOMPLETE"
    expected_completion: "incomplete"
    expected_exit: 2
    expected: { policy_status: "not_evaluated" }
    cleanup: "remove_worktree"
    tags: ["refusal", "zero-tests"]

  - id: "RVLAB-07"
    title: "Required analyzer unavailable"
    category: "refusal"
    description: "Remove bundler-audit from the fixture bundle while the policy requires it."
    setup: { strategy: "clone", branch: "lab/07-unavailable-analyzer", operations:
      [{name: "config_replace", from: "bundler_audit:\n    enabled: true\n    required: false", to: "bundler_audit:\n    enabled: true\n    required: true"}, {name: "remove_dependency", gem: "bundler-audit"}, {name: "commit"}] }
    command: *check_changed
    expected_gate: "INCOMPLETE"
    expected_completion: "incomplete"
    expected_exit: 2
    expected: { policy_status: "not_evaluated" }
    cleanup: "remove_worktree"
    tags: ["refusal", "analyzer", "missing"]

