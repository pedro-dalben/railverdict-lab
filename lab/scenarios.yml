    - name: commit
  command: *1
  expected_gate: FAIL
  expected_completion: complete
  expected_exit: 1
  expected:
    introduced_min: 1
  cleanup: remove_worktree
  tags:
  - fast
  - policy
  - rubocop
- id: RVLAB-04
  title: Real Minitest failure
  category: policy_rejection
  description: Enable required Minitest and fail a real Rails test assertion.
  setup:
    strategy: clone
    branch: lab/04-minitest-failure
    operations:
    - name: config_replace
      from: |-
        minitest:
            enabled: false
            required: false
      to: |-
        minitest:
            enabled: true
            required: true
    - name: replace
      path: test/models/order_test.rb
      from: assert @order.valid?
      to: assert_equal 'INVALID', @order.status
    - name: commit
  command: *1
  expected_gate: FAIL
  expected_completion: complete
  expected_exit: 1
  expected:
    analyzer: minitest
    analyzer_status: succeeded
  cleanup: remove_worktree
  tags:
  - policy
  - minitest
  - regression
