  - id: "RVLAB-10"
    title: "Git paths, rename, Unicode, TAB, binary, and empty file"
    category: "git_changed_scope"
    description: "Exercise real Git path encoding and changed-file enumeration."
    setup: { strategy: "clone", branch: "lab/10-git-edge-cases", operations:
      [{name: "rename", from: "app/models/invoice.rb", to: "app/models/billing_invoice.rb"},
       {name: "write", path: "docs/order [special].md", content: "synthetic documentation\n"},
       {name: "write", path: "docs/unicode-é.md", content: "unicode path\n"},
       {name: "write", path: "docs/tab\tname.md", content: "tab path\n"},
       {name: "binary", path: "app/assets/images/lab-edge.png", hex: "89504e470d0a1a0a"},
       {name: "write", path: "docs/empty-edge.txt", content: ""}, {name: "commit"}] }
    command: *check_changed
    expected_gate: "PASS"
    expected_completion: "complete"
    expected_exit: 0
    expected: { changed_paths_min: 6 }
    cleanup: "remove_worktree"
    tags: ["git", "paths", "changed-scope"]

