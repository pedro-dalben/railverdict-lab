       {name: "write", path: "spec/models/order_coverage_spec.rb", content: "require \"spec_helper\"\nRSpec.describe Order do\n  it \"covers the new calculation\" do\n    expect(Order.new(total_amount: 20).covered_total).to eq(30)\n  end\nend\n"}, {name: "commit"}] }
    command: *check_changed
    expected_gate: "PASS"
    expected_completion: "complete"
    expected_exit: 0
    expected: { analyzer: "simplecov", analyzer_status: "succeeded" }
    cleanup: "remove_worktree"
    tags: ["acceptance", "coverage"]

