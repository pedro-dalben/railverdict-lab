  description: A coverage file with an unsupported or malformed schema fails closed
    with INCOMPLETE exit 2.
  setup:
    strategy: clone
    branch: lab/simplecov-native-malformed
    operations:
    - name: replace
      path: ".railverdict.yml"
      from: |2-
          rspec:
            enabled: true
            required: true
          simplecov:
            enabled: true
            required: false
            coverage_path: coverage/coverage.json
            freshness_window_seconds: 86400
      to: |2-
          rspec:
            enabled: false
            required: false
          simplecov:
            enabled: true
            required: true
            coverage_path: coverage/coverage.json
            freshness_window_seconds: 86400
    - name: write
      path: coverage/coverage.json
      content: '{"version":"9.9.9","files":"invalid-not-array"}'
    - name: commit
  command:
    interface: cli
    args:
    - check
    - "--format"
    - json
