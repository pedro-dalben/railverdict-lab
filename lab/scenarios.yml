schema_version: '2.0'
catalog_version: '5.0'
description: External black-box validation contract for the RailVerdict candidate (1.8 Agent Workflow & Review Orchestration over 1.7 Engineering Policy, 1.6 Change Intelligence, 1.5 Brakeman/targeted/reuse, 1.4 Handoff whole-set reuse — 173 scenarios).
check_changed: &id001
  interface: cli
  args:
  - check
  - --changed
  - --base
  - main
  - --format
  - json
check_full: &id002
  interface: cli
  args:
  - check
  - --format
  - json
scenarios:
- id: RVLAB-01
  title: Clean model behavior with a matching test
  category: acceptance
  description: Add a tested Order model method through a real Git commit.
  setup:
    strategy: clone
    branch: lab/01-clean-change
    operations:
    - name: replace
      path: app/models/order.rb
      from: '

        end

        '
      to: "\n  def formatted_total\n    format('%.2f', total_amount)\n  end\nend\n"
    - name: write
      path: spec/models/order_format_spec.rb
      content: "require \"spec_helper\"\n\nRSpec.describe Order do\n  it \"formats\
        \ the total\" do\n    expect(Order.new(total_amount: 50.0).formatted_total).to\
        \ eq(\"50.00\")\n  end\nend\n"
    - name: commit
  command: *id001
  expected_gate: PASS
  expected_completion: complete
  expected_exit: 0
  expected:
    introduced_max: 0
  cleanup: remove_worktree
  tags:
  - fast
  - acceptance
  - positive
- id: RVLAB-02
  title: Historical debt remains non-blocking
  category: acceptance
  description: Touch a harmless file while the tracked baseline debt remains existing.
  setup:
    strategy: clone
    branch: lab/02-existing-debt
    operations:
    - name: append
      path: app/models/customer.rb
      content: '

        # harmless synthetic touch

        '
