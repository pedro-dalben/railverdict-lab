name: RailVerdict Lab 2.0

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      category:
        description: Scenario category
        required: true
        default: acceptance

permissions:
  contents: read

jobs:
  lab:
    name: External black-box campaign
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        category: [acceptance, policy_rejection, refusal, baseline_waiver, git_changed_scope, analyzers, repair_anti_cheating, mcp, package, determinism, multi_fault, pr_intelligence, agent, simplecov]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build RailVerdict candidate gem (handles unpublished 1.3.0)
        run: |
          set -e
          SHA=$(ruby -ryaml -e "puts YAML.load_file('lab/candidate.yml')['candidate']['source_sha']")
          echo "Candidate source SHA: $SHA"
          if [ -z "$SHA" ]; then echo "No source_sha"; exit 1; fi
          rm -rf /tmp/RailVerdict
          git clone --quiet --no-single-branch https://github.com/pedro-dalben/RailVerdict.git /tmp/RailVerdict
          git -C /tmp/RailVerdict fetch --quiet origin
          git -C /tmp/RailVerdict checkout --quiet "$SHA"
          (cd /tmp/RailVerdict && gem build rail_verdict.gemspec -o /tmp/rail_verdict-candidate.gem)
          sha256sum /tmp/rail_verdict-candidate.gem
          echo "CANDIDATE_GEM=/tmp/rail_verdict-candidate.gem" >> $GITHUB_ENV
      - name: Run category
        env:
          BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
        run: |
          set +e
          if [ -f "$CANDIDATE_GEM" ]; then
            scripts/lab_run --category "${{ matrix.category }}" --artifact "$CANDIDATE_GEM"
          else
            scripts/lab_run --category "${{ matrix.category }}"
          fi
          status=$?
          scripts/lab_collect
          exit "$status"
      - name: Upload empirical artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railverdict-lab-${{ matrix.category }}
          path: |
            artifacts/
            docs/VALIDATION_REPORT.md
          retention-days: 30
