name: RailVerdict Lab 2.0

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      category:
        description: Scenario category
        required: true
        default: acceptance

permissions:
  contents: read

jobs:
  lab:
    name: External black-box campaign
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        category: [acceptance, policy_rejection, refusal, baseline_waiver, git_changed_scope, analyzers, repair_anti_cheating, mcp, package, determinism, multi_fault, pr_intelligence, agent, simplecov]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run category
        env:
          BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
        run: |
          set +e
          scripts/lab_run --category "${{ matrix.category }}"
          status=$?
          scripts/lab_collect
          exit "$status"
      - name: Upload empirical artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railverdict-lab-${{ matrix.category }}
          path: |
            artifacts/
            docs/VALIDATION_REPORT.md
          retention-days: 30
