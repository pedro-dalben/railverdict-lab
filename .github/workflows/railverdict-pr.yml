name: RailVerdict Lab 2.0

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      category:
        description: Scenario category
        required: true
        default: acceptance

permissions:
  contents: read

jobs:
  lab:
    name: External black-box campaign
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        category: [acceptance, policy_rejection, refusal, baseline_waiver, git_changed_scope, analyzers, repair_anti_cheating, mcp, package, determinism, multi_fault, pr_intelligence, agent, simplecov, engineering_policy, review_workflow, change_intelligence, freshness, receipt, portability, environment, test_selection, repair, hardening, security]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Resolve RailVerdict candidate gem
        run: |
          set -e
          MODE=$(ruby -ryaml -e "puts YAML.load_file('lab/candidate.yml')['candidate']['mode']")
          GEM_NAME=$(ruby -ryaml -e "puts YAML.load_file('lab/candidate.yml')['candidate']['gem_name']")
          GEM_VERSION=$(ruby -ryaml -e "puts YAML.load_file('lab/candidate.yml')['candidate']['gem_version']")
          EXPECTED_SHA=$(ruby -ryaml -e "puts YAML.load_file('lab/candidate.yml')['candidate']['gem_sha256']")
          SOURCE_SHA=$(ruby -ryaml -e "puts YAML.load_file('lab/candidate.yml')['candidate']['source_sha']")
          echo "Candidate mode: $MODE"
          echo "Candidate gem: $GEM_NAME $GEM_VERSION"
          echo "Expected SHA: $EXPECTED_SHA"
          if [ "$MODE" = "published" ]; then
            echo "Published mode: fetching $GEM_NAME $GEM_VERSION from RubyGems"
            rm -f /tmp/rail_verdict-published.gem ./*.gem
            rm -rf /tmp/gem-fetch
            mkdir -p /tmp/gem-fetch
            (cd /tmp/gem-fetch && gem fetch "$GEM_NAME" -v "$GEM_VERSION" --clear-sources --source https://rubygems.org)
            GEM_FILE=$(ls /tmp/gem-fetch/${GEM_NAME}-*.gem | head -n1)
            if [ -z "$GEM_FILE" ]; then echo "gem fetch produced no gem file"; exit 1; fi
            cp "$GEM_FILE" /tmp/rail_verdict-candidate.gem
            ACTUAL_SHA=$(sha256sum /tmp/rail_verdict-candidate.gem | cut -d' ' -f1)
            echo "Fetched SHA: $ACTUAL_SHA"
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "candidate SHA mismatch: expected $EXPECTED_SHA, got $ACTUAL_SHA"
              exit 1
            fi
            echo "Published gem verified successfully"
            echo "CANDIDATE_GEM=/tmp/rail_verdict-candidate.gem" >> $GITHUB_ENV
          else
            echo "Unpublished/candidate mode: building from source $SOURCE_SHA"
            if [ -z "$SOURCE_SHA" ]; then echo "No source_sha for unpublished mode"; exit 1; fi
            rm -rf /tmp/RailVerdict
            git clone --quiet --no-single-branch https://github.com/pedro-dalben/RailVerdict.git /tmp/RailVerdict
            git -C /tmp/RailVerdict fetch --quiet origin
            git -C /tmp/RailVerdict checkout --quiet "$SOURCE_SHA"
            (cd /tmp/RailVerdict && gem build rail_verdict.gemspec -o /tmp/rail_verdict-candidate.gem)
            sha256sum /tmp/rail_verdict-candidate.gem
            ACTUAL_SHA=$(sha256sum /tmp/rail_verdict-candidate.gem | cut -d' ' -f1)
            echo "Built SHA: $ACTUAL_SHA"
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "candidate SHA mismatch: expected $EXPECTED_SHA, got $ACTUAL_SHA"
              exit 1
            fi
            echo "CANDIDATE_GEM=/tmp/rail_verdict-candidate.gem" >> $GITHUB_ENV
          fi
          cat lab/candidate.yml | grep gem_sha256
      - name: Run category
        env:
          BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
        run: |
          set +e
          if [ -f "$CANDIDATE_GEM" ]; then
            scripts/lab_run --category "${{ matrix.category }}" --artifact "$CANDIDATE_GEM"
          else
            scripts/lab_run --category "${{ matrix.category }}"
          fi
          status=$?
          scripts/lab_collect
          exit "$status"
      - name: Upload empirical artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railverdict-lab-${{ matrix.category }}
          path: |
            artifacts/
            docs/VALIDATION_REPORT.md
          retention-days: 30
