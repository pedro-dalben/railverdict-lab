name: RailVerdict Lab Compatibility

on:
  workflow_dispatch:
    inputs:
      ruby_version:
        description: Ruby version to test
        required: true
        default: "3.4"

permissions:
  contents: read

jobs:
  analyzers:
    name: Analyzer compatibility (\${{ github.event.inputs.ruby_version }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ github.event.inputs.ruby_version }}
          bundler-cache: true
      - name: Run analyzer category
        env:
          BUNDLE_PATH: ${{ github.workspace }}/vendor/bundle
        run: scripts/lab_run --category analyzers
      - name: Generate report
        if: always()
        run: scripts/lab_collect
